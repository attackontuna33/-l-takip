name = "damla-ilac-push"
main = "worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "damla-ilac-db"
database_id = "BURAYA_D1_DATABASE_ID"

[triggers]
crons = ["* * * * *"]
